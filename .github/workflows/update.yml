name: 定时更新 PAT-HOT 数据

on:
  schedule:
    # 分钟错开整点：GitHub Actions 整点是调度高负载时段，整点 cron 会被延迟数小时甚至直接丢弃
    # （2026-10-12 18:00 那次直接没创建，另两次分别晚了 9h44m / 4h54m）。此前 17 */6 * * * 连续 10 天全成功。
    - cron: "17 22,10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# 与 pages.yml 分开：此前两个工作流共用 group: pages + cancel-in-progress:true，
# 一次人工推送就能在「已 git push、尚未部署 Pages」之间把定时刷新打断，
# 站点继续端著旧产物且没有任何告警（2026-10-12 的两次 cancelled 就是这么来的）。
# 这里改为独立分组 + 不取消（排队执行），保证采集要么完整跑完要么明确失败。
concurrency:
  group: pat-hot-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 兜底超时：任何一步挂住都在 50 分钟内明确失败，而不是占满 GitHub 的 6 小时默认上限。
    # 2026-10-13 实测：定时任务在「运行采集器」一步挂了近 5 小时仍未退出，而上面的
    # concurrency 是排队不取消（那是故意的，防人工推送打断采集），于是后面每次定时刷新
    # 都堵在这个卡死的运行后面 —— 数据自 10-11 起再没成功发布过。正常跑只要 3–8 分钟
    # （run#72–75 实测），50 分钟是 6–16 倍余量，只会砍掉挂死，不会误杀正常刷新。
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 提交数据时需要写权限；fetch-depth 保持默认 1 即可
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # 本项目没有 requirements 文件，依赖清单就写在本工作流的 pip install 里，
          # 所以缓存键跟随本文件；collect.py 改动频率（78/85 次数据提交碰不到它）
          # 不能代表依赖是否变化。
          cache: pip
          cache-dependency-path: .github/workflows/update.yml
      - name: 安装轻量嵌入模型（真嵌入聚类；失败自动回退 TF-IDF）
        # sentence-transformers 会拉进整套 torch（约 1–3 GB）。这个依赖只服务
        # collect.py 里的可选近重复合并，装不上时采集器本身会降级为 TF-IDF，
        # 所以绝不能让它拖垮整次数据刷新 —— 标记为可失败继续。
        continue-on-error: true
        run: pip install -q sentence-transformers
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-zh-${{ runner.os }}-${{ hashFiles('collector/collect.py') }}
      - name: 运行单元测试（纯标准库，无网络）
        run: |
          python -m unittest discover -s tests -v
          # 账号/绑定/画像后端（functions/_lib）的纯函数测试：不打网络，
          # D1 用内存 fake，SM 那一跳用注入的 fetchImpl。见 tests/js/。
          node --test tests/js
      - name: 运行采集器（真嵌入聚类 + LLM 中文摘要）
        # 挂死就发生在这一步（run#76 拖满 6h、run#79 近 5h）：所有网络调用虽各自带
        # timeout，但 LLM 增强是按批循环、没有全局时钟预算，上游半死不活时批间退避
        # 可以无限累加。步骤级超时让失败信息直接指向采集器，而非笼统的 job 超时。
        timeout-minutes: 40
        env:
          OPTOHOT_EMBED: "1"
          SENSENOVA_API_KEY: ${{ secrets.SENSENOVA_API_KEY }}
        run: |
          if [ -z "$SENSENOVA_API_KEY" ]; then
            echo "⚠️ 未配置 SENSENOVA_API_KEY Secret，将跳过 LLM 中文摘要（降级运行，不影响主流程）"
          fi
          python collector/collect.py --limit 25 --llm
      - name: 对外契约自检（发布前 gate）
        # 三频道重构曾把已发布地址改成 api/v1/<ch>/ 而无人察觉，线上消费者直接 404。
        # 这里在提交前确认「扁平兼容地址 + 频道地址」都在，坏产物不许进仓库。
        run: python collector/collect.py --check
      - name: 提交数据更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data dist
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 刷新 PAT-HOT 数据 $(date -u +%Y-%m-%dT%H:%MZ)"
          # 定时任务两次相撞时直接 push 会被拒（non-fast-forward），
          # 此前这种拒绝让整个 run 失败且当天数据丢失；改为 rebase 后重试一次。
          if ! git push; then
            echo "push 被拒，拉取远端更新后重试"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
      - name: 准备站点文件
        run: |
          mkdir -p _site
          cp -r dist/. _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: 发布 Cloudflare Pages（pat-hot.pages.dev，可选）
        # pages.dev 未接 Git 自动发布（见 README「部署到 Cloudflare Pages」节），过去只认
        # 手动 wrangler deploy，于是定时刷新只更新 GitHub Pages，pages.dev 一路落后——
        # 而 SM 侧 PatHotRail 读的正是 pages.dev 的 papers-index，链路时效被这条缺口拖住。
        # 这一步把同一次产物也发到 pages.dev，闭合缺口。
        # 门控：仓库未配置 CLOUDFLARE_API_TOKEN 时整步跳过（不红、不影响 GitHub Pages 部署），
        # 配好 secret 即自动生效。functions/ 与 dist 同级，wrangler 从仓库根自动打包 Functions。
        # 用运行时 shell 守卫而不是 step 级 if：一是 step 的 if 读不到本步自己 env: 里的值
        # （GitHub 已知限制，写成 env.X != '' 会恒假静默失效），二是本文件对
        # SENSENOVA_API_KEY 已用同款守卫口径，两处一致才看得懂。
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ℹ️ 未配置 CLOUDFLARE_API_TOKEN Secret，跳过 pat-hot.pages.dev 发布（GitHub Pages 不受影响）"
            exit 0
          fi
          npx --yes wrangler@4 pages deploy dist --project-name pat-hot --branch master --commit-dirty=true
      - name: 线上回读自检（部署后 gate）
        # deploy-pages 成功只代表"部署动作完成"，不代表线上内容正确——
        # 2026-10-12 的坏产物（内联 CSS 被转义 + 旧版单频道）就是部署"成功"上线的。
        # 这里把发布前 --check 的同源断言用到线上读回的页面上：样式完整、三频道齐全、
        # GitHub Pages 不落后于本次提交。pages.dev 是手动发布，数据落后只提示不失败。
        # 失败只告警不红：Pages 传播有秒级延迟，且此时坏产物已经在线上，跑红也不会
        # 回滚，反而会把当晚 6 点的数据刷新误报成失败。人工按提示处理。
        continue-on-error: true
        run: python collector/collect.py --check-live
